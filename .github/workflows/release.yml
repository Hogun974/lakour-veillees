# Publication d'une version : à chaque étiquette « v* » poussée (ex. v0.11.1), fabrique le contenu (français, puis anglais :
# module lakour-veillees-en engendré des mêmes sources et des dictionnaires contenu/en/), empaquette le système, les deux
# modules de contenu et les mondes vierges (français puis anglais, s'il a son script ; recopiés de monde/dist dans dist/),
# puis crée la release GitHub avec :
#   system.json, lakour-loups.zip, module.json, lakour-veillees.zip, lakour-veillees-en.json, lakour-veillees-en.zip,
#   world.json, la-kour-veillees.zip, world-en.json, la-kour-veillees-en.zip
# Les manifestes publiés portent « manifest » (releases/latest/download/…) et « download » (releases/download/<tag>/…) :
# Foundry trouve donc toujours la dernière version par le manifeste, et chaque version garde son archive. Adresse stable du
# manifeste anglais : https://github.com/Hogun974/lakour-veillees/releases/latest/download/lakour-veillees-en.json
# Le sous-module modules/lakour-mj-ia est récupéré : la fabrication du contenu en a besoin (rendu des cartes, jetons, traduction).
name: Publication

on:
  push:
    tags: ["v*"]
  # Release à blanc, à la main (Actions › Publication › Run workflow, sur principale ou une autre branche) :
  # tout est fabriqué et vérifié comme pour une vraie release, avec la version du manifeste (comme si l'étiquette
  # v<version> était posée) ; le contenu de dist/ est déposé en artefact du workflow, rien n'est publié.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    name: Fabriquer et publier
    runs-on: ubuntu-latest
    steps:
      - name: Dépôt et sous-module
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          # Le moteur lakour-mj-ia doit être lisible : dépôt public, ou PAT (lecture) dans le secret SOUS_MODULE_TOKEN.
          token: ${{ secrets.SOUS_MODULE_TOKEN || github.token }}

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: L'étiquette porte la version du système (convention de docs/publication.md)
        # Release à blanc hors étiquette : rien à comparer, l'empaquetage se fait comme si l'étiquette v<version> était posée.
        run: |
          SYS=$(node -p "require('./systems/lakour-loups/system.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$SYS" != "$GITHUB_REF_NAME" ]; then
              echo "Étiquette $GITHUB_REF_NAME, système en $SYS : mettre system.json à jour (ou poser v$SYS)" >&2; exit 1
            fi
          else
            echo "Release à blanc sur « $GITHUB_REF_NAME » (pas d'étiquette) : empaquetage comme v$SYS"
          fi
          echo "TAG=v$SYS" >> "$GITHUB_ENV"

      - name: Dépendances
        run: npm ci

      - name: Essais
        run: npm run essais

      - name: Fabrication du contenu (src/, packs/, compositions)
        run: npm run fabriquer-veillees

      - name: Module anglais lakour-veillees-en (modules/lakour-veillees-en/, hors git)
        run: npm run fabriquer-veillees-en

      - name: Empaquetage du système et des modules
        run: node outils/empaqueter-paquets.mjs --tag "$TAG" --sortie dist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Empaquetage des mondes vierges, français puis anglais (si « npm run empaqueter-monde » existe), recopiés dans dist/
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if node -e "process.exit((require('./package.json').scripts || {})['empaqueter-monde'] ? 0 : 1)"; then
            npm run empaqueter-monde
            npm run empaqueter-monde -- --langue en
            cp monde/dist/world.json dist/world.json
            cp monde/dist/la-kour-veillees.zip dist/la-kour-veillees.zip
            cp monde/dist/world-en.json dist/world-en.json
            cp monde/dist/la-kour-veillees-en.zip dist/la-kour-veillees-en.zip
          else
            echo "Pas de script empaqueter-monde : le monde n'est pas publié dans cette version."
          fi

      - name: Vérification des fichiers à publier
        run: |
          ls -la dist/
          for f in dist/system.json dist/lakour-loups.zip dist/module.json dist/lakour-veillees.zip dist/lakour-veillees-en.json dist/lakour-veillees-en.zip; do
            test -s "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          node -e "for (const f of require('fs').readdirSync('dist').filter(f => f.endsWith('.json'))) { const m = require('./dist/' + f); console.log(f, m.id, m.version, '->', m.download); }"

      - name: Notes de version
        id: notes
        run: |
          SYS=$(node -p "require('./dist/system.json').version")
          MOD=$(node -p "require('./dist/module.json').version")
          MONDE=$(ls dist/*.zip | grep -v -e lakour-loups.zip -e lakour-veillees.zip -e lakour-veillees-en.zip -e -en.zip | head -n 1 || true)
          {
            echo "Système \`lakour-loups\` ${SYS} · module de contenu \`lakour-veillees\` ${MOD} · English edition \`lakour-veillees-en\` ${MOD}"
            if [ -n "$MONDE" ]; then echo "· monde : \`$(basename "$MONDE")\`"; fi
            if [ -s dist/world-en.json ]; then echo "· English world: \`world-en.json\` (\`la-kour-veillees-en.zip\`)"; fi
            echo
            echo "Installation dans Foundry VTT (v14) : voir le README. Manifeste du système :"
            echo "\`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/system.json\`"
            echo
            echo "English content module (same documents, same identifiers as \`lakour-veillees\`; enable only one of the two) :"
            echo "\`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lakour-veillees-en.json\`"
            echo
            echo "Détail des changements : [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          } > dist/NOTES.md

      - name: Release GitHub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: dist/NOTES.md
          files: |
            dist/*.json
            dist/*.zip
          fail_on_unmatched_files: true

      # Release à blanc (lancement à la main) : pas de release GitHub, dist/ est déposé en artefact à télécharger.
      - name: Release à blanc (dist/ déposé en artefact, rien n'est publié)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-a-blanc-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
